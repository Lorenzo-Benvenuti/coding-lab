name: tests

# One job per language folder. Adding a language means adding a job here and
# nothing else: the root of the repository stays build-tool free.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: mvn -B -f java/pom.xml test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Exit code 5 means no tests collected, expected until the first Python
      # exercise lands. Drop the guard once it does.
      - run: pytest || [ "$?" -eq 5 ]
