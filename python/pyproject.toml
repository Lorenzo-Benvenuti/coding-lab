[project]
name = "python-lab"
version = "1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Source roots declared explicitly, the counterpart of sourceDirectory in pom.xml.
# pythonpath puts code/tdd/src on sys.path, so modules are imported by their folder
# path and no __init__.py or conftest.py is needed anywhere.
pythonpath = ["code/tdd/src"]
testpaths = ["code/tdd/test"]
# importlib lets two exercises carry the same test file name under main/ and timed/.
# The default import mode aborts collection with "import file mismatch" instead.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["code/tdd/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
